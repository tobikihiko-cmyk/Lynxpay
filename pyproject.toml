[project]
name = "lynxpay"
version = "0.1.0"
description = "Standalone tenant-isolated M-PESA Daraja infrastructure"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: requires a dedicated PostgreSQL test database",
    "sandbox: requires explicit Safaricom sandbox credentials",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]
external = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402", "F401"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
