services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lynxpay_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lynxpay_test"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 30s

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      POSTGRES_TEST_DATABASE_URL: postgresql://postgres:test-only@postgres-test:5432/lynxpay_test
    depends_on:
      postgres-test:
        condition: service_healthy
