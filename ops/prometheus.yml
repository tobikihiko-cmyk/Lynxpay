global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/lynxpay-alerts.yml

scrape_configs:
  - job_name: lynxpay-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/lynxpay_metrics_token
    static_configs:
      - targets: ["lynxpay-api:10000"]

