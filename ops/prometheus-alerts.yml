groups:
  - name: lynxpay-api
    rules:
      - alert: LynxPayHighServerErrorRate
        expr: sum(rate(lynxpay_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(lynxpay_http_requests_total[5m])), 0.001) > 0.02
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "LynxPay API 5xx rate exceeds 2%"
          runbook: "docs/runbooks/incident-response.md#api-errors"
      - alert: LynxPayP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(lynxpay_http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "LynxPay API p95 latency exceeds two seconds"
          runbook: "docs/runbooks/incident-response.md#latency"
      - alert: LynxPayRateLimitingSpike
        expr: sum(rate(lynxpay_rate_limited_total[5m])) > 5
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "LynxPay is rejecting more than five requests per second"
          runbook: "docs/runbooks/incident-response.md#rate-limiting"
      - alert: LynxPayCallbackRateLimited
        expr: sum(increase(lynxpay_rate_limited_total{class=~"callback.*"}[5m])) > 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "LynxPay rejected callback traffic at the ingress budget"
          runbook: "docs/runbooks/incident-response.md#callback-rate-limited"
      - alert: LynxPayWebhookDeadLetters
        expr: lynxpay_webhook_deliveries{status="dead_letter"} > 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "LynxPay has dead-lettered webhook deliveries"
          runbook: "docs/runbooks/incident-response.md#payment-or-callback-anomaly"
      - alert: LynxPayOldWebhookBacklog
        expr: lynxpay_oldest_webhook_age_seconds > 900
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "The oldest undelivered webhook is more than 15 minutes old"
          runbook: "docs/runbooks/incident-response.md#replay-or-disable-a-webhook"
      - alert: LynxPayEmailDeadLetters
        expr: lynxpay_email_deliveries{status="dead_letter"} > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "LynxPay has dead-lettered identity emails"
          runbook: "docs/runbooks/incident-response.md#api-errors"
      - alert: LynxPayUnknownPayments
        expr: lynxpay_payments_unknown_count > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "LynxPay has payments requiring reconciliation"
          runbook: "docs/runbooks/incident-response.md#payment-or-callback-anomaly"
      - alert: LynxPayOldUnknownPayment
        expr: lynxpay_oldest_unknown_payment_age_seconds > 900
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "A payment has remained unknown for more than 15 minutes"
          runbook: "docs/runbooks/incident-response.md#investigate-a-missing-customer-payment"
      - alert: LynxPayCallbackP95DelayHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(lynxpay_callback_latency_seconds_bucket[10m]))) > 120
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "M-PESA callback p95 arrival delay exceeds two minutes"
          runbook: "docs/runbooks/incident-response.md#payment-or-callback-anomaly"
      - alert: LynxPayReconciliationBacklogHigh
        expr: lynxpay_reconciliation_backlog > 100
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "More than 100 payments are awaiting reconciliation"
          runbook: "docs/runbooks/incident-response.md#investigate-a-missing-customer-payment"
      - alert: LynxPayOldReconciliationBacklog
        expr: lynxpay_oldest_reconciliation_age_seconds > 900
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "A payment has awaited reconciliation for more than 15 minutes"
          runbook: "docs/runbooks/incident-response.md#investigate-a-missing-customer-payment"
      - alert: LynxPayDatabaseMetricCollectionFailure
        expr: increase(lynxpay_database_gauge_collection_errors_total[10m]) > 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "LynxPay cannot collect database-backed operational metrics"
          runbook: "docs/runbooks/incident-response.md#api-errors"
      - alert: LynxPayStaleStkSubmission
        expr: lynxpay_stale_stk_submissions > 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "An STK submission has exceeded its durable submission lease"
          runbook: "docs/runbooks/incident-response.md#payment-or-callback-anomaly"
      - alert: LynxPayUnmatchedCallbacks
        expr: lynxpay_callbacks{status="unmatched"} > 0
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "M-PESA callbacks require payment-link investigation"
          runbook: "docs/runbooks/incident-response.md#payment-or-callback-anomaly"
      - alert: LynxPayWebhookEndpointsPaused
        expr: lynxpay_webhook_endpoints_paused > 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "A merchant webhook endpoint was auto-paused"
          runbook: "docs/runbooks/incident-response.md#payment-or-callback-anomaly"
      - alert: LynxPayWorkerModeHeartbeatStale
        expr: max by (mode) (lynxpay_worker_mode_heartbeat_age_seconds{mode=~"webhooks|reconciliation|reversals|email|maintenance"}) > 120
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "LynxPay {{ $labels.mode }} worker heartbeat is stale"
          runbook: "docs/runbooks/incident-response.md#worker-heartbeat-missing"
      - alert: LynxPayWorkerModeMissing
        expr: absent(lynxpay_worker_mode_heartbeat_age_seconds{mode="webhooks"}) or absent(lynxpay_worker_mode_heartbeat_age_seconds{mode="reconciliation"}) or absent(lynxpay_worker_mode_heartbeat_age_seconds{mode="reversals"}) or absent(lynxpay_worker_mode_heartbeat_age_seconds{mode="email"}) or absent(lynxpay_worker_mode_heartbeat_age_seconds{mode="maintenance"})
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "At least one required LynxPay worker mode is not reporting"
          runbook: "docs/runbooks/incident-response.md#worker-heartbeat-missing"
      - alert: LynxPayDatabasePoolSaturation
        expr: lynxpay_database_pool_checked_out / clamp_min(lynxpay_database_pool_capacity, 1) > 0.9
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "LynxPay database pool is above 90% of discovered capacity"
          runbook: "docs/runbooks/incident-response.md#database-pool-saturation"
      - alert: LynxPayDarajaErrorRateHigh
        expr: sum(rate(lynxpay_stk_push_failed_total[5m])) / clamp_min(sum(rate(lynxpay_payments_created_total[5m])), 0.001) > 0.1
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Daraja STK failure/uncertainty rate exceeds 10%"
          runbook: "docs/runbooks/incident-response.md#daraja-errors"
      - alert: LynxPaySafaricomNonSuccessCodeRateHigh
        expr: sum by (operation) (rate(lynxpay_mpesa_result_codes_total{code!~"0|200"}[10m])) / clamp_min(sum by (operation) (rate(lynxpay_mpesa_result_codes_total[10m])), 0.001) > 0.1
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Safaricom non-success response rate exceeds 10% for {{ $labels.operation }}"
          runbook: "docs/runbooks/incident-response.md#daraja-errors"
      - alert: LynxPayMerchantPaymentFailureRateHigh
        expr: sum by (merchant_id) (rate(lynxpay_merchant_payment_outcomes_total{status=~"failure|unknown"}[15m])) / clamp_min(sum by (merchant_id) (rate(lynxpay_merchant_payment_outcomes_total[15m])), 0.001) > 0.2
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "Merchant {{ $labels.merchant_id }} payment failure rate exceeds 20%"
          runbook: "docs/runbooks/incident-response.md#merchant-specific-failures"
      - alert: LynxPayReversalNeedsReview
        expr: sum(lynxpay_reversal_requests{status=~"unknown|timed_out|failed"}) > 0
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "A reversal requires operator review"
          runbook: "docs/runbooks/incident-response.md#reversal-needs-review"
