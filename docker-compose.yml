services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lynxpay
      POSTGRES_USER: lynxpay
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - lynxpay_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lynxpay -d lynxpay"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - lynxpay_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    env_file: ${LYNXPAY_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://lynxpay:local-development-only@postgres:5432/lynxpay
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ${LYNXPAY_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://lynxpay:local-development-only@postgres:5432/lynxpay
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
    ports:
      - "${LYNXPAY_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: ${LYNXPAY_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://lynxpay:local-development-only@postgres:5432/lynxpay
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard:
    build:
      context: ./apps/merchant-dashboard
      dockerfile: Dockerfile
    environment:
      LYNXPAY_API_URL: http://api:8000
      NODE_ENV: production
    ports:
      - "${LYNXPAY_DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  lynxpay_postgres:
  lynxpay_redis:
