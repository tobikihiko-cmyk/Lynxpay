name: LynxPay signed release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lynxpay_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lynxpay_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: mkdir -p artifacts/test
      - run: ruff check app tests alembic
      - run: ruff format --check app tests alembic
      - run: pytest -q --junitxml=artifacts/test/backend.xml
      - run: pytest -q tests/test_postgres_concurrency.py
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/lynxpay_test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/merchant-dashboard/package-lock.json
      - run: npm ci
        working-directory: apps/merchant-dashboard
      - run: npm run lint
        working-directory: apps/merchant-dashboard
      - run: npx tsc --noEmit
        working-directory: apps/merchant-dashboard
      - run: npx vitest run --reporter=json --outputFile=../../artifacts/test/dashboard.json
        working-directory: apps/merchant-dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: release-test-evidence
          path: artifacts/test

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run the Docker-backed merchant journey
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml
          up --build --abort-on-container-exit --exit-code-from playwright playwright
      - name: Upload browser release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-evidence
          path: |
            apps/merchant-dashboard/test-results
            apps/merchant-dashboard/playwright-report
          if-no-files-found: warn
      - name: Stop E2E services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down --volumes

  publish:
    needs: [quality, browser-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Resolve lowercase image names
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api=ghcr.io/${owner}/lynxpay-api" >> "$GITHUB_OUTPUT"
          echo "dashboard=ghcr.io/${owner}/lynxpay-dashboard" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.images.outputs.api }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push dashboard image
        id: dashboard
        uses: docker/build-push-action@v7
        with:
          context: ./apps/merchant-dashboard
          file: ./apps/merchant-dashboard/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.dashboard }}:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      - name: Attest API provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.images.outputs.api }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: Attest dashboard provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.images.outputs.dashboard }}
          subject-digest: ${{ steps.dashboard.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@v4.1.0
      - name: Keylessly sign both image digests
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          DASHBOARD_IMAGE: ${{ steps.images.outputs.dashboard }}
          DASHBOARD_DIGEST: ${{ steps.dashboard.outputs.digest }}
        run: |
          cosign sign --yes "${API_IMAGE}@${API_DIGEST}"
          cosign sign --yes "${DASHBOARD_IMAGE}@${DASHBOARD_DIGEST}"
      - name: Generate API SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.images.outputs.api }}@${{ steps.api.outputs.digest }}
          output-file: artifacts/sbom/api.spdx.json
          artifact-name: lynxpay-api-sbom.spdx.json
      - name: Generate dashboard SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.images.outputs.dashboard }}@${{ steps.dashboard.outputs.digest }}
          output-file: artifacts/sbom/dashboard.spdx.json
          artifact-name: lynxpay-dashboard-sbom.spdx.json
      - uses: actions/download-artifact@v4
        with:
          name: release-test-evidence
          path: artifacts/test
      - uses: actions/download-artifact@v4
        with:
          name: release-playwright-evidence
          path: artifacts/test/playwright
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install alembic sqlalchemy
      - name: Generate release evidence
        env:
          API_IMAGE_DIGEST: ${{ steps.api.outputs.digest }}
          DASHBOARD_IMAGE_DIGEST: ${{ steps.dashboard.outputs.digest }}
        run: >-
          python3 ops/release_evidence.py
          --test-result artifacts/test/backend.xml
          --test-result artifacts/test/dashboard.json
          --test-result artifacts/test/playwright/test-results/results.json
          --sbom artifacts/sbom/api.spdx.json
          --sbom artifacts/sbom/dashboard.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: lynxpay-release-evidence-${{ github.sha }}
          path: |
            artifacts/release
            artifacts/sbom
