name: LynxPay CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lynxpay_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lynxpay_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: ruff format --check app tests alembic
      - run: python -m compileall -q app alembic tests
      - run: pytest -q
      - run: pytest -q tests/test_postgres_concurrency.py
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/lynxpay_test
      - run: bandit -q -r app
      - run: pip-audit -r requirements.txt

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/merchant-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/merchant-dashboard/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run --pool=threads --maxWorkers=1
      - run: npm run build
      - run: npm audit --audit-level=high

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run the real merchant journey
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml
          up --build --abort-on-container-exit --exit-code-from playwright playwright
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            apps/merchant-dashboard/test-results
            apps/merchant-dashboard/playwright-report
          if-no-files-found: warn
      - name: Stop E2E services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down --volumes
